name: CI

on:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - run: npm ci
      # Android lint/test need the SDK and must not share a Gradle build dir in
      # parallel with each other; they run in .github/workflows/android.yml.
      - run: npx nx run-many -t lint,test,contract --exclude=android --parallel=3
        env:
          NX_DAEMON: 'false'

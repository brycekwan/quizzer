[package]
name = "server-rs"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "party-server"
path = "src/main.rs"

[dependencies]
party = { path = "../../libs/party" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socketioxide = { version = "0.18", features = ["state"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "fs"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

name: Android

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle*
            apps/android/gradle/wrapper/gradle-wrapper.properties

      # v3 defaults to the removed Google `tools` package and fails with
      # "Failed to find package 'tools'". v4 skips that package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Write local.properties
        working-directory: apps/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Lint, test, and assemble debug APK
        working-directory: apps/android
        # Single Gradle invocation so tasks share one build dir (no parallel races).
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Name APK for download
        run: |
          mkdir -p dist/android
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/android/party-android-debug.apk"
          if [ "${{ github.event_name }}" = "push" ]; then
            SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
            cp dist/android/party-android-debug.apk \
              "dist/android/party-android-debug-${SHORT_SHA}.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: party-android-debug
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 30

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: npx nx run-many -t lint,test,contract --parallel=3
        env:
          NX_DAEMON: 'false'

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
        run: |
          npx semantic-release
          if [ -f .release-version ]; then
            VERSION="$(tr -d '[:space:]' < .release-version)"
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image name
        if: steps.semantic.outputs.new_release_published == 'true'
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.semantic.outputs.new_release_version }}
          labels: |
            org.opencontainers.image.title=quizzer
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.semantic.outputs.new_release_version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Attach image pull info to GitHub Release
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          NOTES="$(gh release view "v${VERSION}" --json body -q .body)"
          docker_notes=$(printf '%s\n' \
            '## Docker image' \
            '' \
            'Published to GitHub Container Registry (GHCR):' \
            '' \
            '```bash' \
            "docker pull ${IMAGE}:${VERSION}" \
            "docker run --rm -p 8080:8080 ${IMAGE}:${VERSION}" \
            '```' \
            '' \
            "Also tagged as \`${IMAGE}:latest\`.")
          printf '%s\n\n%s\n' "$NOTES" "$docker_notes" > release-notes-full.md
          gh release edit "v${VERSION}" --notes-file release-notes-full.md
